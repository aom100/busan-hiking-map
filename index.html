<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>등산 맛집 지도</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2E8B57"> 
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
        
        #map { width: 100%; height: 100vh; }
        
        .title-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: white; padding: 10px 20px;
            border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center; font-weight: bold; color: #2E8B57;
            border: 2px solid #2E8B57;
            width: 80%; max-width: 300px;
        }

        .share-btn {
            position: absolute; top: 80px; right: 20px; z-index: 10;
            background-color: #FEE500; color: #000000;
            border: none; border-radius: 50%;
            width: 50px; height: 50px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-weight: bold; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
        }

        .my-location-btn {
            position: absolute; bottom: 70px; right: 20px; z-index: 10;
            background-color: #ffffff; color: #333;
            border: none; border-radius: 5px;
            padding: 10px 15px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-weight: bold; font-size: 14px;
            display: flex; align-items: center; gap: 5px;
        }

        .my-logo-box {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 13px; font-weight: bold; color: #333;
            pointer-events: none;
            border: 1px solid #ddd;
        }
        
        .info-box { padding: 10px; width: 220px; text-align: center; }
        .info-title { font-weight: bold; display: block; margin-bottom: 5px; font-size: 16px; color: #333;}
        .info-addr { display: block; font-size: 12px; color: #888; margin-bottom: 5px; } 
        .info-holiday { 
            display: block; font-size: 12px; color: #d32f2f; font-weight: bold;
            margin-bottom: 8px; background-color: #ffebee; padding: 4px; border-radius: 4px;
        }
        .info-tags { margin-bottom: 10px; font-size: 11px; color: #555; }
        .tag-badge { 
            background-color: #e8f5e9; color: #2e7d32; 
            padding: 3px 6px; border-radius: 4px; margin-right: 2px;
            display: inline-block; margin-bottom: 2px;
        }
        .btn-group { display: flex; justify-content: space-between; gap: 5px; }
        .btn {
            flex: 1; padding: 8px 0; border-radius: 6px;
            text-decoration: none; font-size: 12px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            color: white; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-call { background-color: #4CAF50; } 
        .btn-navi { background-color: #FDD835; color: #333; } 
        .btn-detail { background-color: #2E8B57; } 

    </style>
</head>
<body>
    <div class="title-box">
        ⛰️ 등산 하산 맛집
    </div>
    
    <button class="share-btn" onclick="shareMap()" title="친구에게 공유하기">
        📤
    </button>
    
    <div id="map"></div>

    <button class="my-location-btn" onclick="findMyLocation()">
        ◎ 내 위치
    </button>

    <div class="my-logo-box">
        ⓒ Created by 장원석
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a"></script>
    
    <script>
        var mapContainer = document.getElementById('map'); 
        
        // 지도 중심을 '산내음' (수정된 위치: 살짝 밑으로)
        // [수정 좌표] 35.5598, 129.0694
        var targetLat = 35.5598;
        var targetLng = 129.0694;

        var mapCenter = new kakao.maps.LatLng(targetLat, targetLng); 
        var mapOption = { center: mapCenter, level: 7 }; 
        var map = new kakao.maps.Map(mapContainer, mapOption); 

        var myMarker = new kakao.maps.Marker({
            map: map,
            image: new kakao.maps.MarkerImage(
                'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png', 
                new kakao.maps.Size(30, 40)
            )
        });
        myMarker.setVisible(false);

        // 맛집 리스트
        var positions = [
            { 
                title: '산내음', 
                // [좌표 재수정] 방금 위치에서 살짝 밑(남쪽)으로 이동
                lat: 35.5598, 
                lng: 129.0694,

                link: 'https://map.kakao.com/link/search/울산 산내음' 
            },
            {

                lng: 129.056680, 
                address: '부산 금정구 금성동 547-23', 
                phone: '051-516-8106', 
                tags: ['라면', '파전', '도토리묵', '가맥'], 
                link: 'https://map.kakao.com/link/search/부산 연정슈퍼' 
            },
            { 
                title: '자연숯불갈비', 
                lat: 35.4944213, 
                lng: 129.0891476, 
                address: '경남 양산시 하북면 월평로 16', 
                phone: '055-384-9293',
                tags: ['한우갈비살', '등심', '통도사맛집'], 
                link: 'https://map.kakao.com/link/search/양산 자연숯불갈비' 
            },
            { 
                title: '명품생오리', 
                lat: 35.1547889, 
                lng: 129.0164143, 
                address: '부산 부산진구 백양대로320번길 18 1층', 
                phone: '051-892-5992',
                tags: ['생오리', '양념불고기', '가족외식'], 
                link: 'https://map.kakao.com/link/search/부산 개금 명품생오리' 
            },
            { 
                title: '엄마손보리밥', 
                lat: 35.154137, 
                lng: 129.0163963, 
                address: '부산 사상구 주례동 43-17', 
                phone: '051-313-7755',
                tags: ['보리밥', '수육포함', '가성비'], 
                link: 'https://map.kakao.com/link/search/부산 주례동 엄마손보리밥' 
            },
            { 
                title: '일품통돼지김치찌개',

                tags: ['김치찌개', '통돼지볶음', '어린이대공원'], 
                link: 'https://map.kakao.com/link/search/부산 초읍 일품통돼지김치찌개' 
            },

                phone: '051-514-1176',
                tags: ['재첩국', '비빔밥', '아침식사'], 
                link: 'https://map.kakao.com/link/search/부산 아줌마재첩국' 
            },
            { 
                title: '오리방', 
                lat: 35.2514615, 
                lng: 129.0521331,

            },

                tags: ['탄탄면', '가지만두', '웨이팅맛집'], 
                link: 'https://map.kakao.com/link/search/부산 수림식당 본점' 
            },
            { 
                title: '강남웰빙보리밥', 
                lat: 35.2754063,

                phone: '051-513-8997',
                tags: ['보리밥정식', '막걸리공짜', '가성비'], 
                link: 'https://map.kakao.com/link/search/부산 남산동 강남웰빙보리밥' 
            },
            {

                lng: 129.0852957,
                address: '부산 금정구 남산동 960-6', 
                phone: '051-582-3305',
                tags: ['수구레국밥', '아침식사', '혼밥'], 
                link: 'https://map.kakao.com/link/search/부산 남산동 가야포차선지국밥' 
            },
            { 
                title: '오동통치킨호프', 
                lat: 35.273462, 
                lng: 129.0924445, 
                address: '부산 금정구 청룡동 17-23', 
                phone: '051-508-4545',
                holiday: '매주 화요일',
                tags: ['치킨', '호프', '뒷풀이'], 
                link: 'https://map.kakao.com/link/search/부산 청룡동 오동통치킨' 
            },
            { 
                title: '감나무집', 
                lat: 35.2788505, 
                lng: 129.0769869,
                address: '부산 금정구 청룡동 465-2', 
                phone: '010-5180-6235',
                holiday: '매주 화, 수요일',
                tags: ['오리불고기', '주차가능', '단체환영'], 
                link: 'https://map.kakao.com/link/search/부산 청룡동 감나무집' 
            },
            { 
                title: '산데미 수제만두', 
                lat: 35.2750378, 
                lng: 129.0854493,
                address: '부산 금정구 청룡로 65', 
                phone: '051-515-5255',
                holiday: '매주 화요일',
                tags: ['주차가능', '단체석'], 
                link: 'https://map.kakao.com/link/search/부산 산데미 수제만두' 
            }
        ];

        for (var i = 0; i < positions.length; i ++) {
            addMarker(positions[i]);
        }

        function addMarker(data) {
            var marker = new kakao.maps.Marker({
                map: map, position: new kakao.maps.LatLng(data.lat, data.lng)
            });

            var tagsHtml = '';
            if (data.tags) {
                data.tags.forEach(function(tag) {
                    tagsHtml += '<span class="tag-badge">' + tag + '</span>';
                });
            }

            var holidayHtml = '';
            if (data.holiday) {
                holidayHtml = '<span class="info-holiday">🛑 ' + data.holiday + '</span>';
            }

            var naviLink = 'https://map.kakao.com/link/to/' + data.title + ',' + data.lat + ',' + data.lng;

            var content = 
                '<div class="info-box">' +
                    '<span class="info-title">' + data.title + '</span>' +
                    '<span class="info-addr">' + (data.address ? data.address : '') + '</span>' +
                    holidayHtml +
                    '<div class="info-tags">' + tagsHtml + '</div>' +
                    '<div class="btn-group">' +
                        '<a href="tel:' + data.phone + '" class="btn btn-call">📞 전화</a>' +
                        '<a href="' + naviLink + '" class="btn btn-navi" target="_blank">🚗 길찾기</a>' +
                        '<a href="' + data.link + '" class="btn btn-detail" target="_blank">🏠 상세</a>' +
                    '</div>' +
                '</div>';

            var infowindow = new kakao.maps.InfoWindow({ content: content, removable: true });
            
            kakao.maps.event.addListener(marker, 'click', function() { 
                infowindow.open(map, marker); 
            });
            
            // 산내음 정보창 자동 열기
            if(data.title === '산내음') infowindow.open(map, marker);
        }

        function findMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    var locPosition = new kakao.maps.LatLng(lat, lon); 
                    map.setCenter(locPosition);
                    myMarker.setPosition(locPosition);
                    myMarker.setVisible(true); 
                }, function(error) {
                    alert("GPS를 켜주세요!");
                });
            } else {
                alert("위치 기능을 지원하지 않습니다.");
            }
        }

        function shareMap() {
            var currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: '부산 등산 맛집 지도',
                    text: '부산 등산 후 가기 좋은 맛집 지도입니다! - Created by 장원석',
                    url: currentUrl,
                })
                .then(() => console.log('공유 성공'))
                .catch((error) => console.log('공유 실패', error));
            } else {
                var tempElem = document.createElement('textarea');
                tempElem.value = currentUrl;
                document.body.appendChild(tempElem);
                tempElem.select();
                document.execCommand("copy");
                document.body.removeChild(tempElem);
                alert("주소가 복사되었습니다! 친구에게 붙여넣기(Ctrl+V)해서 보내주세요.");
            }
        }
    </script>
</body>
</html>
